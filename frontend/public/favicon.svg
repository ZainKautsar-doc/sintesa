<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sintesa_shield_grad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#01838c"/>
      <stop offset="100%" stop-color="#015056"/>
    </linearGradient>
    <linearGradient id="sintesa_glow" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.8"/>
